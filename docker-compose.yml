version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: workmatch-postgres
    environment:
      POSTGRES_USER: workmatch
      POSTGRES_PASSWORD: workmatch123
      POSTGRES_DB: workmatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workmatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workmatch-network

  # AI Service (Python FastAPI)
  ai-service:
    build:
      context: ./microservices/ai-service
      dockerfile: Dockerfile
    container_name: workmatch-ai
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workmatch-network
    restart: unless-stopped

  # API Core (Go)
  api-core:
    build:
      context: ./microservices/api-core
      dockerfile: Dockerfile
    container_name: workmatch-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://workmatch:workmatch123@postgres:5432/workmatch?sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8080
      - AI_SERVICE_URL=http://ai-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - workmatch-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  workmatch-network:
    driver: bridge
